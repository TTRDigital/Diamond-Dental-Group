# Builds the static site and uploads it to SiteGround over FTPS.
# Runs on every push, when Sanity publishes (webhook -> repository_dispatch),
# and from Actions > "Deploy to SiteGround" > Run workflow.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SG_FTP_SERVER    FTP host from SiteGround Site Tools > Site > FTP Accounts
#   SG_FTP_USERNAME  FTP account whose folder is the site's public_html
#   SG_FTP_PASSWORD
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SANITY_PROJECT_ID  (optional; defaults to stnpzvwa)
#   SG_FTP_DIR         (optional; folder the site goes into, default ./diamonddentalgroups.com/public_html/)
#   GHL_CHAT_WIDGET_ID, GA_ID, GTM_ID (GTM defaults to the live site's container)
name: Deploy to SiteGround

on:
  push:
    branches: [claude/diamond-dental-nextjs-rebuild-xl7o7b, main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # At job level so the steps' `if:` checks can see them.
    env:
      SG_FTP_SERVER: ${{ secrets.SG_FTP_SERVER }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || 'stnpzvwa' }}
      NEXT_PUBLIC_GHL_CHAT_WIDGET_ID: ${{ vars.GHL_CHAT_WIDGET_ID }}
      NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
      # The live site's Google Tag Manager container (it also fires the Google Ads tag).
      NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID || 'GTM-M664LDQG' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build

      # Download from the run page for a manual upload.
      - name: Keep a copy of the site
        uses: actions/upload-artifact@v4
        with:
          name: diamond-dental-group-site
          path: out/
          include-hidden-files: true
          retention-days: 14

      # Prints the FTP account's folders, so the upload folder (SG_FTP_DIR) can be checked from the run log.
      - name: Show SiteGround folders
        if: env.SG_FTP_SERVER != ''
        env:
          FTP_USER: ${{ secrets.SG_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SG_FTP_PASSWORD }}
        run: |
          for d in "" "diamonddentalgroups.com/" "diamonddentalgroups.com/public_html/"; do
            echo "== /$d"
            curl -s --ssl-reqd --max-time 30 --user "$FTP_USER:$FTP_PASS" "ftp://$SG_FTP_SERVER/$d" | head -40 || true
          done

      - name: Upload to SiteGround
        # Skipped (build check only) until the FTP secrets are added.
        if: env.SG_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SG_FTP_SERVER }}
          username: ${{ secrets.SG_FTP_USERNAME }}
          password: ${{ secrets.SG_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          # The FTP account opens one level above the site (it lists diamonddentalgroups.com/),
          # so the site's document root is diamonddentalgroups.com/public_html.
          server-dir: ${{ vars.SG_FTP_DIR || './diamonddentalgroups.com/public_html/' }}
